<path class="motion-curve" d="M90,310 Q266,310 442,105.5556" fill="none" stroke="#1d4ed8" stroke-width="4"/>
<polyline class="tangent-line" points="266,271.6667 442,118.3333" fill="none" stroke="#b45309" stroke-width="3.5" stroke-dasharray="8 6"/>
