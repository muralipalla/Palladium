<line x1="90" y1="233.3333" x2="530" y2="233.3333" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="6" x="78" y="240.3333" text-anchor="end" font-size="21">6</text>
<line x1="90" y1="195" x2="530" y2="195" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="9" x="78" y="202" text-anchor="end" font-size="21">9</text>
<line x1="90" y1="156.6667" x2="530" y2="156.6667" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="12" x="78" y="163.6667" text-anchor="end" font-size="21">12</text>
<line x1="90" y1="118.3333" x2="530" y2="118.3333" stroke="#d8e0eb" stroke-width="1"/>
