<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img" aria-labelledby="title description">
<title id="title">Velocity–time (v–t)</title><desc id="description">Velocity–time graph. straight segments join (0 s, -2 m/s), (2 s, 2 m/s), (5 s, 2 m/s).</desc>
<rect width="560" height="390" rx="12" fill="white"/>
<g font-family="Arial, sans-serif" fill="#14213d">
<text x="28" y="29" font-size="23" font-weight="700">Velocity–time (v–t)</text>
<text x="28" y="60" font-size="20" fill="#475569">Straight-line segments</text>
<line x1="90" y1="80" x2="90" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="0" x="90" y="338" text-anchor="middle" font-size="21">0</text>
<line x1="178" y1="80" x2="178" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="1" x="178" y="338" text-anchor="middle" font-size="21">1</text>
<line x1="266" y1="80" x2="266" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="2" x="266" y="338" text-anchor="middle" font-size="21">2</text>
<line x1="354" y1="80" x2="354" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="3" x="354" y="338" text-anchor="middle" font-size="21">3</text>
<line x1="442" y1="80" x2="442" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="4" x="442" y="338" text-anchor="middle" font-size="21">4</text>
<line x1="530" y1="80" x2="530" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="5" x="530" y="338" text-anchor="middle" font-size="21">5</text>
<line x1="90" y1="310" x2="530" y2="310" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="-4" x="78" y="317" text-anchor="end" font-size="21">−4</text>
<line x1="90" y1="252.5" x2="530" y2="252.5" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="-2" x="78" y="259.5" text-anchor="end" font-size="21">−2</text>
<line x1="90" y1="195" x2="530" y2="195" stroke="#475569" stroke-width="2"/>
<text class="value-tick" data-value="0" x="78" y="202" text-anchor="end" font-size="21">0</text>
<line x1="90" y1="137.5" x2="530" y2="137.5" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="2" x="78" y="144.5" text-anchor="end" font-size="21">2</text>
<line x1="90" y1="80" x2="530" y2="80" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="4" x="78" y="87" text-anchor="end" font-size="21">4</text>
<path d="M90,80 V310 H530" stroke="#475569" stroke-width="2" fill="none"/>
<text x="310" y="376" font-size="22" text-anchor="middle">Time, t (s)</text>
<text x="25" y="195" transform="rotate(-90 25 195)" font-size="22" text-anchor="middle">v (m/s)</text>
<polyline class="motion-series" data-series="Velocity" points="90,252.5 266,137.5 530,137.5" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linejoin="round"/>
<circle class="data-point" data-time="0" data-value="-2" cx="90" cy="252.5" r="5" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
<text x="101" y="240.5" text-anchor="start" font-size="19" font-weight="700" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round" fill="#1d4ed8">(0, −2)</text>
<circle class="data-point" data-time="2" data-value="2" cx="266" cy="137.5" r="5" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
<text x="277" y="125.5" text-anchor="start" font-size="19" font-weight="700" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round" fill="#1d4ed8">(2, 2)</text>
<circle class="data-point" data-time="5" data-value="2" cx="530" cy="137.5" r="5" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
<text x="519" y="125.5" text-anchor="end" font-size="19" font-weight="700" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round" fill="#1d4ed8">(5, 2)</text>
</g></svg>
