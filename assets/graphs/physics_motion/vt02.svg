<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img" aria-labelledby="title description">
<title id="title">Velocity–time (v–t)</title><desc id="description">Velocity–time graph. straight segments join (0 s, 0 m/s), (4 s, 8 m/s).</desc>
<rect width="560" height="390" rx="12" fill="white"/>
<g font-family="Arial, sans-serif" fill="#14213d">
<text x="28" y="29" font-size="23" font-weight="700">Velocity–time (v–t)</text>
<text x="28" y="60" font-size="20" fill="#475569">Straight-line segments</text>
<line x1="90" y1="80" x2="90" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="0" x="90" y="338" text-anchor="middle" font-size="21">0</text>
<line x1="200" y1="80" x2="200" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="1" x="200" y="338" text-anchor="middle" font-size="21">1</text>
<line x1="310" y1="80" x2="310" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="2" x="310" y="338" text-anchor="middle" font-size="21">2</text>
<line x1="420" y1="80" x2="420" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="3" x="420" y="338" text-anchor="middle" font-size="21">3</text>
<line x1="530" y1="80" x2="530" y2="310" stroke="#d8e0eb"/>
<text class="time-tick" data-value="4" x="530" y="338" text-anchor="middle" font-size="21">4</text>
<line x1="90" y1="310" x2="530" y2="310" stroke="#475569" stroke-width="2"/>
<text class="value-tick" data-value="0" x="78" y="317" text-anchor="end" font-size="21">0</text>
<line x1="90" y1="264" x2="530" y2="264" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="2" x="78" y="271" text-anchor="end" font-size="21">2</text>
<line x1="90" y1="218" x2="530" y2="218" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="4" x="78" y="225" text-anchor="end" font-size="21">4</text>
<line x1="90" y1="172" x2="530" y2="172" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="6" x="78" y="179" text-anchor="end" font-size="21">6</text>
<line x1="90" y1="126" x2="530" y2="126" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="8" x="78" y="133" text-anchor="end" font-size="21">8</text>
<line x1="90" y1="80" x2="530" y2="80" stroke="#d8e0eb" stroke-width="1"/>
<text class="value-tick" data-value="10" x="78" y="87" text-anchor="end" font-size="21">10</text>
<path d="M90,80 V310 H530" stroke="#475569" stroke-width="2" fill="none"/>
<text x="310" y="376" font-size="22" text-anchor="middle">Time, t (s)</text>
<text x="25" y="195" transform="rotate(-90 25 195)" font-size="22" text-anchor="middle">v (m/s)</text>
<polyline class="motion-series" data-series="Velocity" points="90,310 530,126" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linejoin="round"/>
<circle class="data-point" data-time="0" data-value="0" cx="90" cy="310" r="5" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
<text x="101" y="298" text-anchor="start" font-size="19" font-weight="700" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round" fill="#1d4ed8">(0, 0)</text>
<circle class="data-point" data-time="4" data-value="8" cx="530" cy="126" r="5" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
<text x="519" y="114" text-anchor="end" font-size="19" font-weight="700" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round" fill="#1d4ed8">(4, 8)</text>
</g></svg>
