<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img" aria-labelledby="title description">
<title id="title">Displacement–time (x–t)</title><desc id="description">Displacement–time graph. straight segments join (0 s, 2 m), (2 s, 10 m), (4 s, 10 m), (6 s, -2 m).</desc>
